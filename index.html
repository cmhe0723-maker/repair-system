<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4e78">
  <meta name="description" content="登記報修需求，並查看最近的報修清單與處理狀態。">
  <title>報修登記</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="報修登記">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>報修登記</h1>
    <p>填寫下方表單送出報修，送出後會出現在清單中。（示範系統，請使用虛構資料）</p>
    <div id="install-bar" class="install-bar" hidden>
      <button id="install-btn" type="button" hidden>安裝到主畫面</button>
      <p id="ios-hint" class="install-hint" hidden>想像 App 一樣使用？在 Safari 點「分享」→「加入主畫面」。</p>
    </div>
  </header>

  <div id="offline-banner" class="offline-banner" role="status" aria-live="polite" hidden>
    目前離線：可以瀏覽上次載入的清單，但無法送出報修。
  </div>

  <main>
    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title">新增報修</h2>
      <form id="repair-form" novalidate>
        <div class="field">
          <label for="reporter_name">報修人 <span class="req">*</span></label>
          <input id="reporter_name" name="reporter_name" type="text" maxlength="50" autocomplete="name" required>
        </div>

        <div class="field">
          <label for="location">地點或部門 <span class="req">*</span></label>
          <input id="location" name="location" type="text" maxlength="100" required>
        </div>

        <div class="field">
          <label for="category">類別 <span class="req">*</span></label>
          <select id="category" name="category" required>
            <option value="" selected disabled>請選擇</option>
            <option value="設備">設備</option>
            <option value="網路">網路</option>
            <option value="環境">環境</option>
            <option value="其他">其他</option>
          </select>
        </div>

        <div class="field">
          <label for="description">問題說明 <span class="req">*</span></label>
          <textarea id="description" name="description" rows="4" maxlength="1000" required></textarea>
        </div>

        <fieldset class="field">
          <legend>緊急程度 <span class="req">*</span></legend>
          <div class="segmented">
            <label><input type="radio" name="urgency" value="低"><span>低</span></label>
            <label><input type="radio" name="urgency" value="中" checked><span>中</span></label>
            <label><input type="radio" name="urgency" value="高"><span>高</span></label>
          </div>
        </fieldset>

        <button id="submit-btn" type="submit">送出報修</button>
        <p id="form-message" class="message" role="status" aria-live="polite" hidden></p>
      </form>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">最近 20 筆報修</h2>
        <button id="refresh-btn" type="button" class="secondary">重新整理</button>
      </div>
      <p id="list-message" class="muted" role="status" aria-live="polite">載入中…</p>
      <ul id="request-list" class="request-list"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
          integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
