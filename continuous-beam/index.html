<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuous Beam Designer</title>
<meta name="theme-color" content="#16314f">
<meta name="description" content="Continuous steel beam analysis and AISC 360 LRFD/ASD design.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beam">
<style>
:root{
  --bg:#f3f5f8; --panel:#fff; --ink:#1d2430; --muted:#5d6878; --line:#d7dde6;
  --accent:#1f5fae; --accent-ink:#fff; --ok:#1b7f3b; --ng:#c62828; --warn:#a36200;
  --cD:#3b6db3; --cL:#d9771f; --cV:#2b8a6e; --cM:#8a3fb3; --cDef:#c0392b; --cR:#1f5fae;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans TC","Noto Sans Thai","Microsoft JhengHei",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:10;background:#16314f;color:#fff;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{font-weight:700;font-size:17px}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.toolbar .btn{background:#24497a;color:#fff;border:1px solid #3c679f}
.toolbar .btn:hover{background:#2f5a93}
.toolbar select{background:#24497a;color:#fff;border:1px solid #3c679f;border-radius:6px;padding:5px 6px}
.toolbar label{display:flex;gap:4px;align-items:center;font-size:12px;opacity:.95}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#eef2f7}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--ng)}
.btn.sm{padding:2px 8px;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:14px;padding:14px;align-items:start}
.layout>*{min-width:0}
.inputs{position:sticky;top:64px;max-height:calc(100vh - 78px);overflow:auto;padding-right:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px;color:#16314f}
.card h3{font-size:14px;margin:0 0 8px;color:#16314f}
.fld{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);border-radius:5px;padding:5px 6px;background:#fff;color:var(--ink);width:100%;min-width:0}
.fld textarea{min-height:48px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mt{margin-top:8px}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.geo-row{display:grid;grid-template-columns:70px 1fr auto;gap:8px;align-items:end;padding:5px 0;border-bottom:1px dashed var(--line)}
.geo-row .tag{font-weight:600;font-size:12px;color:#16314f;padding-bottom:6px}
.geo-row.sup .tag{color:var(--accent)}
.load{border:1px solid var(--line);border-left:4px solid var(--cD);border-radius:6px;padding:8px;margin-bottom:8px}
.load.L{border-left-color:var(--cL)}
.load .head{display:grid;grid-template-columns:24px 1.4fr 1fr 0.8fr auto;gap:6px;align-items:end}
.load .num{font-weight:700;color:var(--muted);padding-bottom:6px}
.chk{display:flex;gap:6px;align-items:center;font-size:13px}
.report-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:flex-end}
.report-head h1{font-size:19px;margin:0;color:#16314f}
.meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.svgwrap{overflow-x:auto}
.svgwrap svg{display:block;width:100%;min-width:620px;height:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:right;vertical-align:top}
th{background:#eef2f7;color:#16314f;font-weight:600;text-align:center}
td.l,th.l{text-align:left}
.tablewrap{overflow-x:auto}
.ok{color:var(--ok);font-weight:700}
.ng{color:var(--ng);font-weight:700}
.msg{border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.msg.err{background:#fde8e8;color:var(--ng);border:1px solid #f3b7b7}
.msg.warn{background:#fff4e0;color:var(--warn);border:1px solid #f1d29b}
.combo-bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.combo-bar select{border:1px solid var(--line);border-radius:5px;padding:5px 6px;background:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-2px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:6px;padding:8px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:700}
.detail{font-size:12.5px;color:var(--ink)}
.detail code{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.print-only{display:none}
body.pdf-mode .print-only{display:block}
body.pdf-mode #report{width:790px;background:#fff;padding:0}
body.pdf-mode #report .card{break-inside:avoid;page-break-inside:avoid}
body.pdf-mode #report .svgwrap svg{min-width:0}
@media (max-width:900px){
  .topbar{position:static}
  .layout{grid-template-columns:1fr}
  .inputs{position:static;max-height:none;overflow:visible;padding-right:0}
}
@media (max-width:480px){
  .layout{padding:10px 8px}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .load .head{grid-template-columns:20px 1fr 1fr;}
}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;font-size:12px}
  .no-print{display:none!important}
  .print-only{display:block!important}
  .layout{display:block;padding:0}
  .card{break-inside:avoid;page-break-inside:avoid;border:1px solid #bbb}
  .svgwrap{overflow:visible}
  .svgwrap svg{min-width:0}
}
</style>
</head>
<body>
<header class="topbar no-print">
  <div class="brand" data-i18n="appTitle"></div>
  <div class="toolbar">
    <button class="btn" data-act="new" data-i18n="new"></button>
    <button class="btn" data-act="open" data-i18n="open"></button>
    <button class="btn" data-act="save" data-i18n="save"></button>
    <button class="btn" data-act="print" data-i18n="print"></button>
    <button class="btn" data-act="pdf" data-i18n="pdf"></button>
    <button class="btn" data-act="install" data-i18n="install" id="installBtn" hidden></button>
    <label><span data-i18n="language"></span>
      <select id="langSel">
        <option value="zh">繁體中文</option><option value="en">English</option>
        <option value="th">ไทย</option><option value="id">Bahasa Indonesia</option>
      </select></label>
    <label><span data-i18n="units"></span><select id="unitSel"></select></label>
    <label><span data-i18n="code"></span>
      <select id="codeSel"><option value="LRFD">LRFD</option><option value="ASD">ASD</option></select></label>
  </div>
</header>
<main class="layout">
  <section class="inputs no-print" id="inputs"></section>
  <section class="results" id="report"></section>
</main>
<input type="file" id="fileInput" accept=".json,.beam.json,application/json" hidden>

/* ====================== Section properties ====================== */
function secProps(s){
 const {d,bf,tw,tf}=s;const h=d-2*tf,h0=d-tf;
 const A=2*bf*tf+h*tw;
 const Ix=bf*d**3/12-(bf-tw)*h**3/12;
 const Iy=2*tf*bf**3/12+h*tw**3/12;
 const Sx=2*Ix/d,Sy=2*Iy/bf;
 const Zx=bf*tf*(d-tf)+tw*h*h/4,Zy=bf*bf*tf/2+h*tw*tw/4;
 const J=(2*bf*tf**3+h0*tw**3)/3,Cw=Iy*h0*h0/4;
 const rts=Math.sqrt(Math.sqrt(Iy*Cw)/Sx);
 return{d,bf,tw,tf,h,h0,A,Ix,Iy,Sx,Sy,Zx,Zy,J,Cw,rts,rx:Math.sqrt(Ix/A),ry:Math.sqrt(Iy/A),wt:A*1e-6*7850*9.80665/1000};
}
function validSection(s){return s.d>0&&s.bf>0&&s.tw>0&&s.tf>0&&s.d>2*s.tf&&s.bf>=s.tw}

/* ====================== AISC 360 checks ====================== */
function flexure(sec,mat,Lb,Cb){
 const E=mat.E,Fy=mat.Fy,{Sx,Zx,ry,rts,J,h0,h,tw,bf,tf}=sec;
 const Mp=Fy*Zx,Mr=0.7*Fy*Sx;
 const lamf=bf/(2*tf),lpf=0.38*Math.sqrt(E/Fy),lrf=1.0*Math.sqrt(E/Fy);
 const lamw=h/tw,lpw=3.76*Math.sqrt(E/Fy),lrw=5.70*Math.sqrt(E/Fy);
 const Lp=1.76*ry*Math.sqrt(E/Fy);
 const jc=J/(Sx*h0);
 const Lr=1.95*rts*E/(0.7*Fy)*Math.sqrt(jc+Math.sqrt(jc*jc+6.76*(0.7*Fy/E)**2));
 let Mltb,zone;
 if(Lb<=Lp){Mltb=Mp;zone='Lb ≤ Lp'}
 else if(Lb<=Lr){Mltb=Math.min(Mp,Cb*(Mp-(Mp-Mr)*(Lb-Lp)/(Lr-Lp)));zone='Lp < Lb ≤ Lr'}
 else{const r=Lb/rts;const Fcr=Cb*Math.PI**2*E/(r*r)*Math.sqrt(1+0.078*jc*r*r);Mltb=Math.min(Mp,Fcr*Sx);zone='Lb > Lr'}
 let Mflb,fcls;
 if(lamf<=lpf){Mflb=Mp;fcls='compact'}
 else if(lamf<=lrf){Mflb=Mp-(Mp-Mr)*(lamf-lpf)/(lrf-lpf);fcls='noncompact'}
 else{const kc=Math.min(0.76,Math.max(0.35,4/Math.sqrt(lamw)));Mflb=0.9*E*kc*Sx/(lamf*lamf);fcls='slender'}
 const wcls=lamw<=lpw?'compact':lamw<=lrw?'noncompact':'slender';
 return{Mn:Math.min(Mltb,Mflb),Mp,Mltb,Mflb,Lp,Lr,lamf,lpf,lrf,lamw,lpw,lrw,fcls,wcls,zone,Lb,Cb};
}
function shearCap(sec,mat){

 if(ht<=2.24*Math.sqrt(E/Fy)){Cv1=1;phi=1.0;om=1.5}
 else{phi=0.9;om=1.67;const kv=5.34,lim=1.10*Math.sqrt(kv*E/Fy);Cv1=ht<=lim?1:lim/ht}

}

/* ====================== FE analysis (Euler-Bernoulli, banded solver) ====================== */
function normLoads(st,warn){
 const out=[];
 st.loads.forEach((l,i)=>{
  const L=st.spans[l.span];if(L==null){warn.push(t('spanOut',{n:i+1}));return}
  const c=l.case==='L'?'L':'D',cl=x=>Math.min(L,Math.max(0,+x||0));
  if(l.type==='point')out.push({kind:'point',case:c,span:l.span,x:cl(l.x),P:+l.P||0,i});
  else if(l.type==='moment')out.push({kind:'moment',case:c,span:l.span,x:cl(l.x),M:+l.M||0,i});
  else{
   const x1=cl(l.x1),x2=cl(l.x2);if(!(x2-x1>L*1e-6)){warn.push(t('loadSkipped',{n:i+1}));return}
   let w1,w2;if(l.type==='udl'){w1=w2=+l.w||0}else if(l.type==='tri'){if(l.peak==='start'){w1=+l.w||0;w2=0}else{w1=0;w2=+l.w||0}}else{w1=+l.w1||0;w2=+l.w2||0}
   out.push({kind:'dist',case:c,span:l.span,x1,x2,w1,w2,i,type:l.type});
  }
 });
 return out;
}
function analyze(st){

 for(let s=0;s<nS;s++){
  const L=st.spans[s];const pts=[];
  for(let k=0;k<=ND;k++)pts.push(L*k/ND);

  pts.sort((a,b)=>a-b);const u=[];

  if(s===0){nodes.push({x:0,span:0,loc:0});supNode.push(0)}
  let prev=nodes.length-1;
  for(let j=1;j<u.length;j++){
   nodes.push({x:X0[s]+u[j],span:s,loc:u[j]});

  e.q.D[0]+=sw;e.q.D[1]+=sw;
  for(const l of loads){if(l.kind!=='dist'||l.span!==e.span)continue;const tol=st.spans[e.span]*1e-6;
   if(e.a>=l.x1-tol&&e.b<=l.x2+tol){const f=x=>l.w1+(l.w2-l.w1)*(x-l.x1)/(l.x2-l.x1);e.q[l.case][0]+=f(e.a);e.q[l.case][1]+=f(e.b)}}
 }

  for(let i=0;i<4;i++)for(let j=0;j<4;j++){const r=e.dofs[i],c=e.dofs[j];if(c>=r)K[r][c-r]+=e.k[i][j]}

 }
 const cons=[];st.supports.forEach((s,i)=>{const k=supNode[i];if(s==='fixed')cons.push(2*k,2*k+1);else if(s==='pin'||s==='roller')cons.push(2*k)});
 let maxd=0;for(let i=0;i<nd;i++)maxd=Math.max(maxd,Math.abs(K[i][0]));
 for(const r of cons){K[r].fill(0);K[r][0]=maxd;for(let k=1;k<=BW;k++)if(r-k>=0)K[r-k][k]=0;F.D[r]=0;F.L[r]=0}
 for(let i=0;i<nd;i++){
  const piv=K[i][0];if(!(piv>maxd*1e-11))return{ok:false,error:t('unstable'),warn,sec,X0,supNode};
  for(let k=1;k<=BW;k++){const j=i+k;if(j>=nd)break;const f=K[i][k]/piv;if(f===0)continue;
   for(let mm=k;mm<=BW;mm++)if(i+mm<nd)K[j][mm-k]-=f*K[i][mm];F.D[j]-=f*F.D[i];F.L[j]-=f*F.L[i]}
 }
 const D={};
 for(const c of['D','L']){const d=new Float64Array(nd);for(let i=nd-1;i>=0;i--){let s=F[c][i];for(let k=1;k<=BW;k++)if(i+k<nd)s-=K[i][k]*d[i+k];d[i]=s/K[i][0]}D[c]=d}
 // samples
 const sx=[],sspan=[],sloc=[];const out={D:{V:[],M:[],v:[]},L:{V:[],M:[],v:[]}};
 for(const e of elems){
  for(const xi of[0,0.5,1]){sx.push(X0[e.span]+e.a+xi*e.L);sspan.push(e.span);sloc.push(e.a+xi*e.L)}
  for(const c of['D','L']){
   const de=e.dofs.map(k=>D[c][k]);const f=[0,0,0,0];
   for(let i=0;i<4;i++){let s=e.ff[c][i];for(let j=0;j<4;j++)s+=e.k[i][j]*de[j];f[i]=s}
   (e.f||(e.f={}))[c]=f;const[qa,qb]=e.q[c],L=e.L,V0=f[0],M0=-f[1];
   for(const xi of[0,0.5,1]){const x=xi*L;
    out[c].V.push(V0-(qa*x+(qb-qa)*x*x/(2*L)));
    out[c].M.push(M0+V0*x-(qa*x*x/2+(qb-qa)*x**3/(6*L)));
    let v;if(xi===0)v=de[0];else if(xi===1)v=de[2];else v=0.5*de[0]+L/8*de[1]+0.5*de[2]-L/8*de[3]-(qa+qb)/2*L**4/(384*EI);
    out[c].v.push(v)}
  }
 }
 const R={D:[],L:[]};
 st.supports.forEach((s,i)=>{const k=supNode[i];
  for(const c of['D','L']){let rv=0,rm=0;for(const e of elems){if(e.n1===k){rv+=e.f[c][0];rm+=e.f[c][1]}if(e.n2===k){rv+=e.f[c][2];rm+=e.f[c][3]}}
   rv-=Fn[c][2*k];rm-=Fn[c][2*k+1];
   R[c].push({v:(s==='free')?0:rv,m:(s==='fixed')?-rm:0,has:s!=='free',hasM:s==='fixed'})}});
 return{ok:true,warn,sec,X0,supNode,loads,sw,sx,sspan,sloc,cases:out,R,Ltot:X0[nS]};
}
function comb(res,D,L,key){const a=res.cases.D[key],b=res.cases.L[key];return a.map((v,i)=>D*v+L*b[i])}
function combR(res,D,L){return res.R.D.map((r,i)=>({v:D*r.v+L*res.R.L[i].v,m:D*r.m+L*res.R.L[i].m,has:r.has,hasM:r.hasM}))}

function design(st,res){
 const sec=res.sec,mat=st.material,combos=COMBOS[st.code],lrfd=st.code==='LRFD';
 const sh=shearCap(sec,mat);const Vcap=lrfd?sh.phi*sh.Vn:sh.Vn/sh.om;
 const nS=st.spans.length;const rows=[];
 const Mc=combos.map(c=>comb(res,c.D,c.L,'M')),Vc=combos.map(c=>comb(res,c.D,c.L,'V'));
 const vL=res.cases.L.v,vT=comb(res,1,1,'v');
 for(let s=0;s<nS;s++){
  const L=st.spans[s];const idx=[];res.sspan.forEach((sp,i)=>{if(sp===s)idx.push(i)});
  const cant=(s===0&&st.supports[0]==='free')||(s===nS-1&&st.supports[nS]==='free');
  let segs;const lbm=st.design.lbMode;
  if(lbm==='full')segs=[[0,L,0]];else if(lbm==='supports')segs=[[0,L,L]];
  else{const lb=Math.max(1,+st.design.lb||L);const nn=Math.max(1,Math.ceil(L/lb-1e-9));segs=[];for(let k=0;k<nn;k++)segs.push([k*L/nn,(k+1)*L/nn,L/nn])}
  const Mat=(M,x)=>{let p=idx[0];for(const i of idx){if(res.sloc[i]>=x){const a=res.sloc[p],b=res.sloc[i];return b-a<1e-9?M[i]:M[p]+(M[i]-M[p])*(x-a)/(b-a)}p=i}return M[idx[idx.length-1]]};
  let flex=null,mpos=0,mneg=0;
  combos.forEach((c,ci)=>{const M=Mc[ci];
   for(const i of idx){mpos=Math.max(mpos,M[i]);mneg=Math.min(mneg,M[i])}
   segs.forEach(([a,b,Lb],si)=>{
    let Mmax=0;for(const i of idx){const x=res.sloc[i];if(x>=a-1e-6&&x<=b+1e-6)Mmax=Math.max(Mmax,Math.abs(M[i]))}
    let Cb=1;if(st.design.cbMode==='auto'&&!cant&&Mmax>0&&Lb>0){const q=(b-a)/4;const MA=Math.abs(Mat(M,a+q)),MB=Math.abs(Mat(M,a+2*q)),MC=Math.abs(Mat(M,a+3*q));Cb=Math.min(3,12.5*Mmax/(2.5*Mmax+3*MA+4*MB+3*MC))}
    const fl=flexure(sec,mat,Lb,Cb);const cap=lrfd?0.9*fl.Mn:fl.Mn/1.67;const ratio=cap>0?Mmax/cap:Infinity;
    if(!flex||ratio>flex.ratio)flex={ratio,Mmax,cap,fl,combo:c.id,seg:si+1,nseg:segs.length,a,b}});
  });
  let shear={ratio:-1};combos.forEach((c,ci)=>{let Vmax=0;for(const i of idx)Vmax=Math.max(Vmax,Math.abs(Vc[ci][i]));const r=Vmax/Vcap;if(r>shear.ratio)shear={ratio:r,Vmax,cap:Vcap,combo:c.id}});
  let dL=0,dT=0;for(const i of idx){dL=Math.max(dL,Math.abs(vL[i]));dT=Math.max(dT,Math.abs(vT[i]))}
  const Ld=cant?2*L:L;const limL=Ld/(+st.design.defLL||360),limT=Ld/(+st.design.defTL||240);
  rows.push({s,L,cant,flex,shear,mpos,mneg,dL,dT,limL,limT,rL:dL/limL,rT:dT/limT});
 }
 return{rows,sh,Vcap,lrfd};
}

const SW=1000,PL=70,PR=34;

function supportSym(type,px,py,isEnd,side){

 if(type==='pin'){g.push(`<polygon points="${px},${py} ${px-11},${py+18} ${px+11},${py+18}" fill="#fff" stroke="${c}" stroke-width="1.6"/>`,hatchLine(px,py+18))}

 else if(type==='fixed'){
  if(isEnd){const dx=side<0?-1:1;let h=`<line x1="${px}" y1="${py-20}" x2="${px}" y2="${py+20}" stroke="${c}" stroke-width="2.4"/>`;for(let k=-18;k<=14;k+=8)h+=`<line x1="${px}" y1="${py+k}" x2="${px+dx*8}" y2="${py+k+8}" stroke="${c}" stroke-width="1"/>`;g.push(h)}
  else g.push(`<rect x="${px-9}" y="${py-9}" width="18" height="27" fill="#cfd6e0" stroke="${c}" stroke-width="1.4"/>`,hatchLine(px,py+18));

}
function hatchLine(px,y){let h=`<line x1="${px-15}" y1="${y}" x2="${px+15}" y2="${y}" stroke="#334" stroke-width="1.4"/>`;for(let k=-14;k<=10;k+=6)h+=`<line x1="${px+k}" y1="${y}" x2="${px+k-5}" y2="${y+6}" stroke="#334" stroke-width="0.9"/>`;return h}
function arrowDown(x,y1,y2,col,w=1.4){const up=y2<y1;const s=up?1:-1;return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${col}" stroke-width="${w}"/><polygon points="${x},${y2} ${x-4},${y2-s*-8} ${x+4},${y2-s*-8}" fill="${col}"/>`}
function beamBase(res,st,beamY){
 let g=`<line x1="${xs(res,0)}" y1="${beamY}" x2="${xs(res,res.Ltot)}" y2="${beamY}" stroke="#223" stroke-width="5" stroke-linecap="round"/>`;
 st.supports.forEach((s,i)=>{const px=xs(res,res.X0[i]);const isEnd=i===0||i===st.supports.length-1;g+=supportSym(s,px,beamY+2.5,isEnd,i===0?-1:1)});

}
function dimLine(res,st,y){
 let g=`<line x1="${xs(res,0)}" y1="${y}" x2="${xs(res,res.Ltot)}" y2="${y}" stroke="#889" stroke-width="1"/>`;
 res.X0.forEach((x,i)=>{const px=xs(res,x);g+=`<line x1="${px}" y1="${y-6}" x2="${px}" y2="${y+6}" stroke="#889"/><text x="${px}" y="${y+20}" font-size="12" text-anchor="middle" fill="#557">S${i+1}</text>`});
 st.spans.forEach((L,i)=>{const px=(xs(res,res.X0[i])+xs(res,res.X0[i+1]))/2;g+=`<text x="${px}" y="${y-5}" font-size="12.5" text-anchor="middle" fill="#334">${fD(L,'len')} ${us('len')}</text>`});

function loadDiagram(st,res){

 lanes.forEach((l,k)=>{

  g+=`<text x="${(x1+x2)/2}" y="${yb-Math.max(h1,h2)-5}" font-size="12" text-anchor="middle" fill="${col}">${esc(lab)}</text>`;
 });
 g+=beamBase(res,st,beamY);
 pts.forEach(l=>{const px=xs(res,res.X0[l.span]+l.x);const col=colOf(l.case);
  if(l.kind==='point'){const yTop=Math.max(14,beamY-stackH+6);const down=l.P>=0;g+=down?arrowDown(px,yTop,beamY-4,col,2.2):arrowDown(px,beamY-4,yTop,col,2.2);
   g+=`<text x="${px+5}" y="${yTop+2}" font-size="12.5" font-weight="600" fill="${col}">${l.case}: P = ${fD(l.P,'force')} ${us('force')}</text>`}

   g+=`<path d="M ${px-r} ${cy} A ${r} ${r} 0 1 1 ${px} ${cy+r}" fill="none" stroke="${col}" stroke-width="2"/>`;
   g+=cw?`<polygon points="${px-r},${cy} ${px-r-5},${cy-8} ${px-r+5},${cy-8}" fill="${col}"/>`:`<polygon points="${px},${cy+r} ${px+8},${cy+r-5} ${px+8},${cy+r+5}" fill="${col}"/>`;
   g+=`<text x="${px+r+4}" y="${cy-r}" font-size="12.5" font-weight="600" fill="${col}">${l.case}: M = ${fD(l.M,'mom')} ${us('mom')} ${cw?'↻':'↺'}</text>`}

function chart(st,res,y,q,color,label){

  <label class="fld mt"><span>${t('notes')}</span><textarea data-path="project.notes" data-kind="text">${esc(st.project.notes)}</textarea></label></div>
 <div class="card"><h2>${t('geometry')}</h2>${geo}<div class="mt"><button class="btn" data-act="addSpan">+ ${t('addSpan')}</button></div></div>
 <div class="card"><h2>${t('loads')}</h2>${loads}<button class="btn" data-act="addLoad">+ ${t('addLoad')}</button><p class="note">${t('loadNote')}</p></div>
 <div class="card"><h2>${t('material')}</h2>
  ${sel('material.grade',st.material.grade,gradeOpts,t('grade'))}
  <div class="grid3 mt">${num('material.Fy',st.material.Fy,'stress','Fy')}${num('material.Fu',st.material.Fu,'stress','Fu')}${num('material.E',st.material.E,'stress','E')}</div></div>
 <div class="card"><h2>${t('section')}</h2>${shapeSel}
  <div class="grid4 mt">${num('section.d',st.section.d,'dim','d')}${num('section.bf',st.section.bf,'dim','bf')}${num('section.tw',st.section.tw,'dim','tw')}${num('section.tf',st.section.tf,'dim','tf')}</div>
  <p class="note">${t('secNote')}</p></div>
 <div class="card"><h2>${t('design')}</h2>
  <label class="chk"><input type="checkbox" data-path="design.selfWeight" data-kind="chk"${D.selfWeight?' checked':''}> ${t('selfWeight')}</label>
  <div class="grid2 mt">${sel('design.lbMode',D.lbMode,[['full',t('lb_full')],['supports',t('lb_supports')],['custom',t('lb_custom')]],t('lbMode'))}
  ${D.lbMode==='custom'?num('design.lb',D.lb,'len',t('lb'),'min="0"'):'<div></div>'}</div>
  <div class="mt">${sel('design.cbMode',D.cbMode,[['auto',t('cb_auto')],['one',t('cb_one')]],t('cbMode'),false)}</div>
  <div class="grid2 mt">${num('design.defLL',D.defLL,null,t('deflLL'),'min="1"')}${num('design.defTL',D.defTL,null,t('deflTL'),'min="1"')}</div>
  <p class="note">${t('designNote')}<br>${t('codeNote')}</p></div>`;
}

/* ====================== Results / report ====================== */
function renderResults(){
 const st=state;const today=new Date().toISOString().slice(0,10);
 let head=`<div class="card"><div class="report-head"><div><h1>${t('appTitle')}</h1><div class="meta"><span><b>${t('projName')}:</b> ${esc(st.project.name)}</span>${st.project.engineer?`<span><b>${t('engineer')}:</b> ${esc(st.project.engineer)}</span>`:''}<span><b>${t('date')}:</b> ${today}</span></div></div>
  <div class="meta"><span><b>${t('code')}:</b> AISC 360-22 ${st.code}</span><span><b>${t('units')}:</b> ${UNITS[st.units].label}</span></div></div>
  ${st.project.notes?`<p class="note">${esc(st.project.notes).replace(/\n/g,'<br>')}</p>`:''}</div>`;
 if(!validSection(st.section)){$('#report').innerHTML=head+`<div class="msg err">${t('section')}: d &gt; 2tf, bf ≥ tw &gt; 0</div>`;return}
 if(!(st.spans.every(L=>L>0))){$('#report').innerHTML=head+`<div class="msg err">${t('length')} &gt; 0</div>`;return}
 const res=analyze(st);
 let msgs=res.warn.map(w=>`<div class="msg warn">${esc(w)}</div>`).join('');
 if(!res.ok){$('#report').innerHTML=head+msgs+`<div class="msg err">${esc(res.error)}</div>`+inputSummary(res.sec);return}
 const opts=viewOptions();let vo=opts.find(o=>o.key===st.view.combo);if(!vo){vo=opts[opts.length-1];st.view.combo=vo.key}
 const V=comb(res,vo.D,vo.L,'V'),M=comb(res,vo.D,vo.L,'M'),v=comb(res,vo.D,vo.L,'v'),R=combR(res,vo.D,vo.L);
 const dz=design(st,res);
 const fl0=flexure(res.sec,st.material,0,1);
 if(fl0.wcls!=='compact')msgs+=`<div class="msg warn">${t('webWarn')}</div>`;
 const lr=dz.lrfd;const capM=lr?'φ<sub>b</sub>M<sub>n</sub>':'M<sub>n</sub>/Ω<sub>b</sub>',capV=lr?'φ<sub>v</sub>V<sub>n</sub>':'V<sub>n</sub>/Ω<sub>v</sub>';
 const dM=lr?'M<sub>u</sub>':'M<sub>a</sub>',dV=lr?'V<sub>u</sub>':'V<sub>a</sub>';
 const okc=r=>r<=1+1e-9?`<span class="ok">${t('ok')}</span>`:`<span class="ng">${t('ng')}</span>`;
 // summary
 let maxR=0;dz.rows.forEach(r=>{maxR=Math.max(maxR,r.flex.ratio,r.shear.ratio,r.rL,r.rT)});
 const allM=dz.rows.flatMap(r=>[r.mpos,r.mneg]);
 const summary=`<div class="card"><h3>${t('summary')} — ${t('governing')}: ${st.code}</h3><div class="summary-grid">
  <div class="stat"><div class="k">${t('maxPos')}</div><div class="v">${fD(Math.max(...allM),'mom')} ${us('mom')}</div></div>
  <div class="stat"><div class="k">${t('maxNeg')}</div><div class="v">${fD(Math.min(...allM),'mom')} ${us('mom')}</div></div>
  <div class="stat"><div class="k">${t('maxV')}</div><div class="v">${fD(Math.max(...dz.rows.map(r=>r.shear.Vmax)),'force')} ${us('force')}</div></div>
  <div class="stat"><div class="k">${t('maxDef')} (D+L)</div><div class="v">${fD(Math.max(...dz.rows.map(r=>r.dT)),'defl')} ${us('defl')}</div></div>
  <div class="stat"><div class="k">${t('maxRatio')}</div><div class="v ${maxR<=1?'ok':'ng'}">${maxR.toFixed(3)} ${maxR<=1?t('ok'):t('ng')}</div></div></div></div>`;
 const comboBar=`<div class="card no-print combo-bar"><b>${t('showCombo')}</b><select id="comboSel">${opts.map(o=>`<option value="${o.key}"${o.key===vo.key?' selected':''}>${esc(o.label)}</option>`).join('')}</select></div>`;
 const cname=`<span class="note" style="font-weight:400"> — ${esc(vo.label)}</span>`;
 const diagrams=`
 <div class="card"><h3>${t('dLoad')}</h3><div class="legend"><span><i style="background:var(--cD)"></i>${t('caseD')}</span><span><i style="background:var(--cL)"></i>${t('caseL')}</span></div><div class="svgwrap">${loadDiagram(st,res)}</div></div>
 <div class="card"><h3>${t('dShear')}${cname}</h3><div class="svgwrap">${chart(st,res,V,'force','var(--cV)','V')}</div></div>
 <div class="card"><h3>${t('dMoment')}${cname}</h3><div class="svgwrap">${chart(st,res,M,'mom','var(--cM)','M')}</div></div>
 <div class="card"><h3>${t('dDefl')}${cname}</h3><div class="svgwrap">${chart(st,res,v,'defl','var(--cDef)','δ')}</div></div>
 <div class="card"><h3>${t('dReact')}${cname}</h3><div class="svgwrap">${reactionDiagram(st,res,R)}</div></div>`;
 // reactions table
 const ropts=opts;const rAll=ropts.map(o=>combR(res,o.D,o.L));
 let rt=`<div class="card"><h3>${t('reactions')}</h3><div class="tablewrap"><table><tr><th class="l">${t('support')}</th>${ropts.map(o=>`<th>${esc(o.label)}</th>`).join('')}</tr>`;
 st.supports.forEach((s,i)=>{if(s==='free')return;
  rt+=`<tr><td class="l">S${i+1} (${t('sup_'+s)}) R [${us('force')}]</td>${rAll.map(r=>`<td>${fD(r[i].v,'force')}</td>`).join('')}</tr>`;
  if(s==='fixed')rt+=`<tr><td class="l">S${i+1} M [${us('mom')}]</td>${rAll.map(r=>`<td>${fD(r[i].m,'mom')}</td>`).join('')}</tr>`});
 rt+=`</table></div></div>`;
 // section props
 const S=res.sec;const pr=[['d',S.d,'dim'],['bf',S.bf,'dim'],['tw',S.tw,'dim'],['tf',S.tf,'dim'],['A',S.A,'area'],['Ix',S.Ix,'inertia'],['Iy',S.Iy,'inertia'],['Sx',S.Sx,'mod'],['Zx',S.Zx,'mod'],['rx',S.rx,'dim'],['ry',S.ry,'dim'],['rts',S.rts,'dim'],['J',S.J,'inertia'],['Cw',S.Cw,'warp'],[t('weight'),S.wt,'dist']];
 const cls=c=>t(c);
 const sp=`<div class="card"><h3>${t('secProps')} — ${esc(st.section.preset==='custom'?t('custom'):st.section.preset)}, ${esc(st.material.grade==='custom'?t('custom'):st.material.grade)}</h3><div class="tablewrap"><table><tr>${pr.map(p=>`<th>${p[0]}<br><small>${us(p[2])}</small></th>`).join('')}</tr><tr>${pr.map(p=>`<td>${fD(p[1],p[2])}</td>`).join('')}</tr></table></div>
  <p class="note">${t('flange')}: b<sub>f</sub>/2t<sub>f</sub> = ${fl0.lamf.toFixed(2)} (λp ${fl0.lpf.toFixed(2)}, λr ${fl0.lrf.toFixed(2)}) → ${cls(fl0.fcls)} &nbsp;|&nbsp; ${t('web')}: h/t<sub>w</sub> = ${fl0.lamw.toFixed(2)} (λp ${fl0.lpw.toFixed(2)}, λr ${fl0.lrw.toFixed(2)}) → ${cls(fl0.wcls)}<br>
  M<sub>p</sub> = ${fD(fl0.Mp,'mom')} ${us('mom')}, L<sub>p</sub> = ${fD(fl0.Lp,'len')} ${us('len')}, L<sub>r</sub> = ${fD(fl0.Lr,'len')} ${us('len')}; V<sub>n</sub> = ${fD(dz.sh.Vn,'force')} ${us('force')} (C<sub>v1</sub> = ${dz.sh.Cv1.toFixed(3)}, ${lr?'φ<sub>v</sub> = '+dz.sh.phi:'Ω<sub>v</sub> = '+dz.sh.om})</p></div>`;
 // design table
 let dt=`<div class="card"><h3>${t('designCheck')} — AISC 360-22 ${st.code}</h3><div class="tablewrap"><table>
 <tr><th rowspan="2">${t('spanNo')}</th><th colspan="5">${t('flexure')}</th><th colspan="3">${t('shear')}</th><th colspan="4">${t('deflection')} (${t('service')})</th><th rowspan="2">${t('status')}</th></tr>
 <tr><th>${dM} [${us('mom')}]</th><th>L<sub>b</sub> / C<sub>b</sub></th><th>${capM} [${us('mom')}]</th><th>${t('ratio')}</th><th>${t('combo')}</th>
 <th>${dV} [${us('force')}]</th><th>${capV} [${us('force')}]</th><th>${t('ratio')}</th>
 <th>δ<sub>L</sub> [${us('defl')}]</th><th>${t('limit')}</th><th>δ<sub>D+L</sub> [${us('defl')}]</th><th>${t('limit')}</th></tr>`;
 dz.rows.forEach(r=>{const worst=Math.max(r.flex.ratio,r.shear.ratio,r.rL,r.rT);
  dt+=`<tr><td>${r.s+1}${r.cant?'*':''}</td><td>${fD(r.flex.Mmax,'mom')}</td><td>${fD(r.flex.fl.Lb,'len')} / ${r.flex.fl.Cb.toFixed(2)}</td><td>${fD(r.flex.cap,'mom')}</td><td>${r.flex.ratio.toFixed(3)}</td><td>${r.flex.combo}</td>
  <td>${fD(r.shear.Vmax,'force')}</td><td>${fD(r.shear.cap,'force')}</td><td>${r.shear.ratio.toFixed(3)}</td>
  <td>${fD(r.dL,'defl')}</td><td>${fD(r.limL,'defl')}</td><td>${fD(r.dT,'defl')}</td><td>${fD(r.limT,'defl')}</td><td>${okc(worst)}</td></tr>`});
 dt+=`</table></div>`;
 const det=dz.rows.map(r=>{const f=r.flex.fl;return `<li><b>${t('span')} ${r.s+1}</b>: ${t('segment')} ${r.flex.seg}/${r.flex.nseg} (${fD(r.flex.a,'len')}–${fD(r.flex.b,'len')} ${us('len')}), ${f.zone}; M<sub>n,LTB</sub> = ${fD(f.Mltb,'mom')}, M<sub>n,FLB</sub> = ${fD(f.Mflb,'mom')}, M<sub>n</sub> = ${fD(f.Mn,'mom')} ${us('mom')}; ${t('maxPos')} ${fD(r.mpos,'mom')}, ${t('maxNeg')} ${fD(r.mneg,'mom')} ${us('mom')}</li>`}).join('');
 dt+=`<details open class="detail mt"><summary><b>${t('details')}</b></summary><ul>${det}</ul><p class="note">${lr?'φ<sub>b</sub> = 0.90':'Ω<sub>b</sub> = 1.67'}. C<sub>b</sub> = 12.5M<sub>max</sub>/(2.5M<sub>max</sub>+3M<sub>A</sub>+4M<sub>B</sub>+3M<sub>C</sub>) ≤ 3.0. ${dz.rows.some(r=>r.cant)?'* '+t('cantNote'):''}<br>${t('designNote')}</p></details></div>`;
 $('#report').innerHTML=head+msgs+inputSummary(res.sec)+comboBar+summary+diagrams+rt+dt+sp;
}
function inputSummary(sec){
 const st=state;
 const sup=st.supports.map((s,i)=>`S${i+1}: ${t('sup_'+s)}`).join(', ');
 const spans=st.spans.map((L,i)=>`${t('span')} ${i+1} = ${fD(L,'len')} ${us('len')}`).join(', ');
 const ld=st.loads.map((l,i)=>{let d;
  if(l.type==='point')d=`x = ${fD(l.x,'len')} ${us('len')}, P = ${fD(l.P,'force')} ${us('force')}`;
  else if(l.type==='moment')d=`x = ${fD(l.x,'len')} ${us('len')}, M = ${fD(l.M,'mom')} ${us('mom')}`;
  else{const r=`${fD(l.x1,'len')}–${fD(l.x2,'len')} ${us('len')}`;
   d=l.type==='udl'?`${r}, w = ${fD(l.w,'dist')} ${us('dist')}`:l.type==='tri'?`${r}, w max = ${fD(l.w,'dist')} ${us('dist')} @ ${l.peak==='start'?t('peakStart'):t('peakEnd')}`:`${r}, w1 = ${fD(l.w1,'dist')}, w2 = ${fD(l.w2,'dist')} ${us('dist')}`}
  return `<tr><td>${i+1}</td><td class="l">${t('ld_'+l.type)}</td><td>${l.case}</td><td>${l.span+1}</td><td class="l">${d}</td></tr>`}).join('');
 const D=st.design;const lb=D.lbMode==='custom'?`${t('lb_custom')}: ${fD(D.lb,'len')} ${us('len')}`:t('lb_'+D.lbMode);
 return `<div class="card print-only"><h3>${t('inputSummary')}</h3>
 <p class="detail"><b>${t('supports')}:</b> ${sup}<br><b>${t('spans')}:</b> ${spans}</p>
 <div class="tablewrap"><table><tr><th>#</th><th class="l">${t('type')}</th><th>${t('case')}</th><th>${t('span')}</th><th class="l">${t('mag')}</th></tr>${ld}</table></div>
 <p class="detail"><b>${t('matSec')}:</b> ${esc(st.material.grade==='custom'?t('custom'):st.material.grade)} — Fy = ${fD(st.material.Fy,'stress')}, Fu = ${fD(st.material.Fu,'stress')}, E = ${fD(st.material.E,'stress')} ${us('stress')};
 ${esc(st.section.preset==='custom'?t('custom'):st.section.preset)} — d ${fD(st.section.d,'dim')}, bf ${fD(st.section.bf,'dim')}, tw ${fD(st.section.tw,'dim')}, tf ${fD(st.section.tf,'dim')} ${us('dim')}<br>
 <b>${t('design')}:</b> ${D.selfWeight?t('selfWeight')+'; ':''}${t('lbMode')}: ${lb}; Cb: ${D.cbMode==='auto'?t('cb_auto'):t('cb_one')}; L/${D.defLL} (${t('liveOnly')}), L/${D.defTL} (D+L)</p></div>`;
}

/* ====================== Rendering & events ====================== */
function $(s){return document.querySelector(s)}
function renderStatic(){
 document.documentElement.lang=HTML_LANG[state.lang]||'en';document.title=t('appTitle');
 document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
 $('#langSel').value=state.lang;$('#codeSel').value=state.code;
 $('#unitSel').innerHTML=Object.entries(UNITS).map(([k,u])=>`<option value="${k}"${k===state.units?' selected':''}>${u.label}</option>`).join('');
}
function renderAll(){renderStatic();renderInputs();renderResults();persist()}
let timer=null;function scheduleCalc(){clearTimeout(timer);timer=setTimeout(()=>{renderResults();persist()},180)}
function setPath(path,val){const ks=path.split('.');let o=state;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=val}
function getPath(path){return path.split('.').reduce((o,k)=>o?.[k],state)}
function applyInput(el){
 const path=el.dataset.path,kind=el.dataset.kind;let v;
 if(kind==='num'){v=parseFloat(el.value);if(!isFinite(v))return false;if(el.dataset.q)v=fromD(v,el.dataset.q)}
 else if(kind==='chk')v=el.checked;else v=el.value;
 if(/^loads\.\d+\.span$/.test(path))v=parseInt(v,10);
 const m=path.match(/^spans\.(\d+)$/);
 if(m){if(!(v>0))return false;const i=+m[1],old=state.spans[i];state.loads.forEach(l=>{if(l.span!==i)return;const k=v/old;for(const f of['x','x1','x2'])l[f]=Math.min(v,l[f]*k)})}
 setPath(path,v);
 if(path==='section.preset'&&SHAPES[v]){const[d,bf,tw,tf]=SHAPES[v];Object.assign(state.section,{d,bf,tw,tf})}
 if(/^section\.(d|bf|tw|tf)$/.test(path)){state.section.preset='custom';const s=document.querySelector('[data-path="section.preset"]');if(s)s.value='custom'}
 if(path==='material.grade'&&GRADES[v]){state.material.Fy=GRADES[v][0];state.material.Fu=GRADES[v][1];return 'rr'}
 if(/^material\.(Fy|Fu)$/.test(path)){state.material.grade='custom';const s=document.querySelector('[data-path="material.grade"]');if(s)s.value='custom'}
 return true;
}
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset||!el.dataset.path||el.tagName==='SELECT'||el.type==='checkbox'||el.dataset.rr)return;if(applyInput(el))scheduleCalc()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='langSel'){state.lang=el.value;renderAll();return}
 if(el.id==='unitSel'){state.units=el.value;renderAll();return}
 if(el.id==='codeSel'){state.code=el.value;state.view.combo='combo:1';renderAll();return}
 if(el.id==='comboSel'){state.view.combo=el.value;renderResults();persist();return}
 if(el.id==='fileInput'){openFile(el);return}
 if(!el.dataset||!el.dataset.path)return;
 if(el.tagName==='SELECT'||el.type==='checkbox'||el.dataset.rr){const r=applyInput(el);if(el.dataset.rr||r==='rr')renderAll();else scheduleCalc()}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a==='addSpan'){const L=state.spans[state.spans.length-1]||6000;state.spans.push(L);state.supports.push('roller');renderAll()}
 else if(a==='delSpan'){state.spans.splice(i,1);state.supports.splice(i+1,1);state.loads=state.loads.filter(l=>l.span!==i).map(l=>({...l,span:l.span>i?l.span-1:l.span}));renderAll()}
 else if(a==='addLoad'){const L=state.spans[0];state.loads.push({type:'udl',case:'D',span:0,x:L/2,P:10*kN,M:10*kN*m,x1:0,x2:L,w:10,w1:5,w2:10,peak:'end'});renderAll()}
 else if(a==='delLoad'){state.loads.splice(i,1);renderAll()}
 else if(a==='new'){if(confirm(t('confirmNew'))){const lang=state.lang,units=state.units,code=state.code;state=defaultState();Object.assign(state,{lang,units,code,loads:[],project:{name:'',engineer:'',notes:''}});renderAll()}}
 else if(a==='open'){$('#fileInput').value='';$('#fileInput').click()}
 else if(a==='save')saveFile();
 else if(a==='print')window.print();
 else if(a==='pdf')exportPDF();
 else if(a==='install')installApp();
});
function fileBase(){return (state.project.name||'beam').replace(/[\\/:*?"<>|]+/g,'_').trim()||'beam'}
function saveFile(){
 const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileBase()+'.beam.json';document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
function openFile(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const s=JSON.parse(r.result);if(!validState(s))throw 0;state=mergeState(s);renderAll()}catch(e){alert(t('openError'))}};r.readAsText(f)}
function loadScript(src){return new Promise((ok,no)=>{if(window.html2pdf)return ok();const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function exportPDF(){
 try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js')}catch(e){alert(t('pdfFallback'));window.print();return}
 document.body.classList.add('pdf-mode');
 try{await window.html2pdf().set({margin:[10,10,10,10],filename:fileBase()+'.pdf',image:{type:'jpeg',quality:0.96},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy'],avoid:['.card']}}).from($('#report')).save()}
 catch(e){alert(t('pdfFallback'));window.print()}
 finally{document.body.classList.remove('pdf-mode')}
}
/* ====================== PWA ====================== */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('#installBtn').hidden=false});
window.addEventListener('appinstalled',()=>{deferredInstall=null;$('#installBtn').hidden=true});
async function installApp(){if(!deferredInstall)return;deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;$('#installBtn').hidden=true}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
window.__beam={analyze:s=>analyze(s),design:(s,r)=>design(s,r),get state(){return state}};
renderAll();
</script>
